  <main>
    <section class="section" style="padding-top:120px">
      <div class="container">
        <div class="section-title reveal">
          <h2>🎮 默契大考验</h2>
          <p>测一测，我们对彼此有多了解</p>
        </div>

        <div class="quiz-box glass reveal" id="quizBox">
          <div class="quiz-progress"><div class="bar" id="quizBar"></div></div>
          <div class="quiz-ques" id="quizQues"></div>
          <div class="quiz-opts" id="quizOpts"></div>
          <div class="quiz-msg" id="quizMsg"></div>
          <button class="btn" id="quizAgain" style="display:none">🔄 再玩一次</button>
        </div>
      </div>
    </section>

    <!-- 真心话卡片 -->
    <section class="section" style="padding-top:10px">
      <div class="container">
        <div class="section-title reveal">
          <h2>🎴 真心话卡片</h2>
          <p>抽一张，轮流回答，看看谁先说真心话</p>
        </div>
        <div class="truth-box glass reveal">
          <div class="truth-card" id="truthCard">👇 点下面的按钮抽一张卡片</div>
          <button class="btn" id="truthBtn">🎴 抽一张</button>
        </div>
      </div>
    </section>

    <!-- 默契度测试 -->
    <section class="section" style="padding-top:10px">
      <div class="container">
        <div class="section-title reveal">
          <h2>💞 默契度测试</h2>
          <p>两个人各答一遍同一套题，看看我们的默契值</p>
        </div>
        <div class="quiz-box glass reveal" id="compatBox">
          <div class="compat-ques" id="compatQues"></div>
          <div class="compat-opts" id="compatOpts"></div>
          <div class="quiz-msg" id="compatMsg"></div>
          <div class="quiz-progress" id="compatBar" style="display:none"><div class="bar" id="compatBarFill"></div></div>
          <button class="btn" id="compatStart">💞 开始测试</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
