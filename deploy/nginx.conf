# ============================================================
# 情侣网站 · Nginx 配置示例
# 用法: 把 dist/ 目录内容上传到服务器后, 将本配置填入
#       nginx 的 server 块(或宝塔面板 → 网站 → 配置文件)
# 注意:
#   1) 记得把 server_name 换成你的域名, root 换成实际路径
#   2) Nginx 不读 .htaccess！data/ 与 lib/ 必须靠下面的 deny 规则保护，
#      否则 data/admin.json（含密码哈希）、data/content.json（私密留言）
#      和 lib/*.php 会被直接下载。
#   3) PHP 段是必需的（本项目后台与接口都是 PHP），请按主机实际情况
#      调整 fastcgi_pass（宝塔面板会自动生成，可只粘贴下面的 deny 段）。
# ============================================================

server {
    listen 80;
    server_name your-domain.com;          # ← 改成你的域名

    root /var/www/love/dist;              # ← 改成 dist 实际路径
    index index.php index.html;           # ← 必须带 index.php，否则 /admin/ 打不开

    # 陌生 Host 一律不服务：nginx 会拿默认 server 接住任何解析到本机的域名，
    # 不校验就等于把整站镜像出去（第三轮在自有 VPS 的 443 上实测过这个行为）。
    # 自有模板的两个 server 块都有这一条（deploy/vps/nginx.conf.template:31、:220），
    # 而这份示例原本只教人"给 443 也抄一份"、自己的 80 块反而漏了（第四轮 F-S12-3）。
    if ($host != your-domain.com) { return 404; }

    # 声明响应编码。Apache 那条路径默认就带 charset（AddDefaultCharset），nginx
    # 不带 —— 中文站点只靠 HTML 里的 <meta charset> 兜底，两条部署路径行为不一致。
    # charset 只**声明**、不改写内容（没有 charset_map/source_charset 就不会转码），
    # 且只作用于 charset_types 列的类型（text/html、text/css、application/javascript 等），
    # 接口的 application/json 与音乐的 application/octet-stream 都不在其列，零风险。
    charset utf-8;

    # 不对外暴露 nginx 版本号。默认会在响应头 `Server:` 与 404 页面正文里写出
    # "nginx/1.18.0 (Ubuntu)"（实测可见）—— 等于免费告诉扫描器该打哪个 CVE。
    # 关掉后仍会保留 `Server: nginx`，这是正常且必要的。
    server_tokens off;

    # 请求体上限。**必须显式写**：nginx 默认只有 1m，而后台保存照片走的是
    # JSON + base64（lib/content.php 的 PHOTO_MAX_BASE64 = 3MB）—— base64 还会
    # 膨胀约 4/3，所以一张 1MB 出头的照片就会被 nginx 以 413 拦掉，
    # PHP 根本没机会执行，前台表现是"照片保存不了"，日志里也看不出是 nginx 挡的。
    # 20m 是给手机直出的大图留的余量（VPS 模板同口径，改这里记得一起改）。
    client_max_body_size 20m;

    # ---------- gzip 压缩(文本类资源体积平均省 60%+) ----------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript
               application/json image/svg+xml;
    gzip_vary on;

    # ---------- 敏感目录：一律拒绝（Nginx 下 .htaccess 完全无效） ----------
    # 点文件（.htaccess / .git / .env 之类）单独一条规则拒绝：nginx 既不读
    # .htaccess、也**不会**自动拒绝它 —— 默认行为就是把它当普通文件下载出去。
    # 本项目构建产物里没有点文件（2026-09-15 实测确认），这条是防将来手滑。
    # `.well-known/` 单独放行，别把 certbot 的 HTTP-01 校验路径也拦掉。
    location ~* /\.(?!well-known/) { deny all; }

    location ^~ /data/ { deny all; }      # 配置/留言/情书/管理员账号
    location ^~ /lib/  { deny all; }      # 只允许被 PHP require
    location ^~ /deploy/ { deny all; }

    # ---------- PHP 处理（按主机实际 socket/端口调整） ----------
    location ~ \.php$ {
        try_files $uri =404;
        # ⚠️ 这里**刻意不写** `error_page 404 =404;` / `error_page 403 =403;`。
        # 2026-09-15 实测发现：这种**不带 URI** 的 `=404` 写法并不是"保持原状态码"，
        # nginx 会把 `=404` 当成跳转目标 URI，于是缺失的 .php 返回的是
        # `302 Location: =404`，而不是 404。同一份配置里 `.html` 那个 location
        # 没写这行、返回的就是正确 404，对比很清楚，就是这行造成的。
        # 本文件底部也不再写 server 级 `error_page 404 /index.html` 兜底首页
        # （原因见那里的注释），所以 PHP 与静态文件的 404/403 会自然原样透传，
        # 不需要、也不该用这行"护栏"。
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;   # 宝塔/其他主机请改这里
        # fastcgi_pass 127.0.0.1:9000;
    }

    # ---------- 上传目录：照片只允许通过 /photo.php 代理读取 ----------
    location ^~ /assets/img/uploads/ { deny all; }

    # assets/img/ 下的真实照片（手动放进服务器的）同样只能走 photo.php
    location ~* ^/assets/img/[^/]+\.(jpe?g|png|webp|gif)$ { deny all; }

    # ---------- 静态资源: 长缓存(构建时已带 ?v= 版本号,
    #           内容变更版本号自动变, 浏览器必定拉新文件) ----------
    # 注意: 缺失的 assets 必须返回真 404（如 music 探测），不要用 error_page
    #       去"兜底"它 —— 不带 URI 的 `error_page 404 =404;` 会变成
    #       `302 Location: =404`，探测逻辑会被这个假跳转带偏。
    location ~* ^/assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # nginx 的 add_header 是"不继承": 本层一旦出现 add_header, server 级
        # 那几个安全头在这类响应上就全部消失。所以每个自己写了 add_header 的
        # location 都必须把安全头重复一遍(见下方"安全头"段的说明)。
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS 也必须在这三处各写一份（同"不继承"的坑）：只打开 server 级那一处的话，
        # CSS/JS 与 HTML 反而拿不到 HSTS —— 而浏览器只会对"带着 HSTS 的那次响应"
        # 记下改写规则，等于白开。三处本轮已全部实开（第四轮 F-S12-2）。
        add_header Strict-Transport-Security "max-age=86400" always;
    }

    # ---------- HTML: 不缓存(每次回源, 保证页面更新即时生效) ----------
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        # 同上: 这里也必须重复安全头, 否则 HTML 反而拿不到 noindex/nosniff
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }

    # ---------- 安全头 ----------
    # 不希望被搜索引擎收录：不要同时在 robots.txt 里写 Disallow: /，
    # 否则爬虫读不到这个头（noindex 失效）。
    # ⚠️ 这几个头只对"没有自己的 add_header 的 location"生效；上面两个 location
    #    各重复了一份，改这里时记得一起改（否则那里会静默不同步）。HSTS 同理：
    #    三处各写一份，本轮已全部实开（第四轮 F-S12-2）。
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 不要用 server 级 error_page 兜底首页 ----------
    # 这里原本有一行 `error_page 404 /index.html;`（"演示站友好"），2026-09-15 移除。
    # 原因：它是 server 级指令，会**把接口和 photo.php 的 404 一起改写**成 200 + 首页
    # HTML —— fetch 拿到一坨 HTML 解析失败、<img> 拿不到图片内容，错误被完全掩盖，
    # 而且排查时看不出任何异常（浏览器里页面好好的）。
    # 当初为了压住这个副作用才在 PHP 段写了 `error_page 404 =404;`，而那种写法本身
    # 又是错的（会变成 302 Location: =404）。两者一起删掉，行为才是对的：
    # 找不到的路径就是真 404，接口的 404 也原样透传。
    # 如果你确实想要"找不到页面就回首页"，请在**页面自己的 location** 里用
    # try_files（例如 `location ~* \.html$ { try_files $uri /index.html; }`），
    # 绝不要在 server 级用 error_page。

    # ---------- 开启 HTTPS 后建议追加(需先申请证书) ----------
    # listen 443 ssl http2;        # nginx 1.18/1.20 用 `listen ... ssl http2`；
    #                              # `http2 on;` 是 1.25.1+ 的新指令，老版本是语法错误
    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;
    #
    # ⚠️ 站点放进 443 之后，把上面 80 块的做法抄过来，给 443 也加一道 Host 校验：
    #     if ($host != your-domain.com) { return 404; }
    #   不加的话，把任意域名解析到本机 IP 都能拿到整站（2026-09-15 在自有 VPS 上
    #   实测到 200）—— 等于本站被"任何指向该 IP 的域名"镜像一份，对方域名下还会
    #   照常带上我们的 HSTS 与安全头。用 server 级 `if` 只做 return 是安全的。

    # 强制 https（对应 deploy/.htaccess 里的 RewriteRule）：
    # 解锁凭证/会话凭证都是 Secure Cookie，http 页面既读不到也无权改写它们，
    # 于是"先在 https 解锁、之后用 http 打开"会永久被弹回锁页（2026-09-12 实测复现）。
    # 做法是把站点放进 443 的 server 块，另起一个 80 的块只做跳转：
    #   server {
    #       listen 80;
    #       server_name your-domain.com;          # ← 改成你的域名
    #       server_tokens off;                    # ⚠️ 不跨 server 块继承：80 块也要写一份，
    #                                             #    否则 301/404 的响应里仍带 nginx 版本号
    #       if ($host != your-domain.com) { return 404; }   # 陌生 Host 不服务
    #       return 301 https://$host$request_uri; # 查询串会被保留
    #   }

    # HSTS：让浏览器在本地就把 http 改写成 https（装好之后连明文请求都不产生）。
    # max-age 先给 1 天（渐进上线）：它是"浏览器里没有绕过按钮"的锁，证书一旦失效，
    # 站点在 max-age 到期前会直接打不开。稳定后调大成 31536000；撤销用 max-age=0。
    # 不加 includeSubDomains / preload：免费主机的子域没必要扩大影响面。
    add_header Strict-Transport-Security "max-age=86400" always;
}
