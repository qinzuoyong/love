# ============================================================
# 情侣网站 · Nginx 配置示例
# 用法: 把 dist/ 目录内容上传到服务器后, 将本配置填入
#       nginx 的 server 块(或宝塔面板 → 网站 → 配置文件)
# 注意: 记得把 server_name 换成你的域名, root 换成实际路径
# ============================================================

server {
    listen 80;
    server_name your-domain.com;          # ← 改成你的域名

    root /var/www/love/dist;              # ← 改成 dist 实际路径
    index index.html;

    # ---------- gzip 压缩(文本类资源体积平均省 60%+) ----------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript
               application/json image/svg+xml;
    gzip_vary on;

    # ---------- 静态资源: 长缓存(构建时已带 ?v= 版本号,
    #           内容变更版本号自动变, 浏览器必定拉新文件) ----------
    # 注意: assets 内的 404 保持原样(如 music.mp3 探测),
    #       不能被下面的 error_page 重定向成 200
    location ~* ^/assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        error_page 404 =404;
    }

    # ---------- HTML: 不缓存(每次回源, 保证页面更新即时生效) ----------
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # ---------- 安全头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 找不到页面时回首页(演示站友好; assets 目录除外) ----------
    error_page 404 /index.html;

    # ---------- 开启 HTTPS 后建议追加(需先申请证书) ----------
    # listen 443 ssl;
    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
