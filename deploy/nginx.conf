# ============================================================
# 情侣网站 · Nginx 配置示例
# 用法: 把 dist/ 目录内容上传到服务器后, 将本配置填入
#       nginx 的 server 块(或宝塔面板 → 网站 → 配置文件)
# 注意:
#   1) 记得把 server_name 换成你的域名, root 换成实际路径
#   2) Nginx 不读 .htaccess！data/ 与 lib/ 必须靠下面的 deny 规则保护，
#      否则 data/admin.json（含密码哈希）、data/content.json（私密留言）
#      和 lib/*.php 会被直接下载。
#   3) PHP 段是必需的（本项目后台与接口都是 PHP），请按主机实际情况
#      调整 fastcgi_pass（宝塔面板会自动生成，可只粘贴下面的 deny 段）。
# ============================================================

server {
    listen 80;
    server_name your-domain.com;          # ← 改成你的域名

    root /var/www/love/dist;              # ← 改成 dist 实际路径
    index index.php index.html;           # ← 必须带 index.php，否则 /admin/ 打不开

    # ---------- gzip 压缩(文本类资源体积平均省 60%+) ----------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript
               application/json image/svg+xml;
    gzip_vary on;

    # ---------- 敏感目录：一律拒绝（Nginx 下 .htaccess 完全无效） ----------
    location ^~ /data/ { deny all; }      # 配置/留言/情书/管理员账号
    location ^~ /lib/  { deny all; }      # 只允许被 PHP require
    location ^~ /deploy/ { deny all; }

    # ---------- PHP 处理（按主机实际 socket/端口调整） ----------
    location ~ \.php$ {
        try_files $uri =404;
        # 接口与 photo.php 主动返回的 404/403 必须保持原状态码，
        # 否则会被文件末尾的 `error_page 404 /index.html` 改写成首页 HTML：
        # fetch 拿到一坨 HTML 解析失败、<img> 拿到非图片内容、错误被掩盖。
        error_page 404 =404;
        error_page 403 =403;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;   # 宝塔/其他主机请改这里
        # fastcgi_pass 127.0.0.1:9000;
    }

    # ---------- 上传目录：照片只允许通过 /photo.php 代理读取 ----------
    location ^~ /assets/img/uploads/ { deny all; }

    # assets/img/ 下的真实照片（手动放进服务器的）同样只能走 photo.php
    location ~* ^/assets/img/[^/]+\.(jpe?g|png|webp|gif)$ { deny all; }

    # ---------- 静态资源: 长缓存(构建时已带 ?v= 版本号,
    #           内容变更版本号自动变, 浏览器必定拉新文件) ----------
    # 注意: assets 内的 404 保持原样(如 music.mp3 探测),
    #       不能被下面的 error_page 重定向成 200
    location ~* ^/assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        error_page 404 =404;
    }

    # ---------- HTML: 不缓存(每次回源, 保证页面更新即时生效) ----------
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # ---------- 安全头 ----------
    # 不希望被搜索引擎收录：不要同时在 robots.txt 里写 Disallow: /，
    # 否则爬虫读不到这个头（noindex 失效）。
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 找不到页面时回首页(演示站友好; assets 目录除外) ----------
    error_page 404 /index.html;

    # ---------- 开启 HTTPS 后建议追加(需先申请证书) ----------
    # listen 443 ssl;
    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    # 强制 https（对应 deploy/.htaccess 里的 RewriteRule）：
    # 解锁凭证/会话凭证都是 Secure Cookie，http 页面既读不到也无权改写它们，
    # 于是"先在 https 解锁、之后用 http 打开"会永久被弹回锁页（2026-09-12 实测复现）。
    # 做法是把站点放进 443 的 server 块，另起一个 80 的块只做跳转：
    #   server {
    #       listen 80;
    #       server_name your-domain.com;          # ← 改成你的域名
    #       return 301 https://$host$request_uri; # 查询串会被保留
    #   }

    # HSTS：让浏览器在本地就把 http 改写成 https（装好之后连明文请求都不产生）。
    # max-age 先给 1 天（渐进上线）：它是"浏览器里没有绕过按钮"的锁，证书一旦失效，
    # 站点在 max-age 到期前会直接打不开。稳定后调大成 31536000；撤销用 max-age=0。
    # 不加 includeSubDomains / preload：免费主机的子域没必要扩大影响面。
    # add_header Strict-Transport-Security "max-age=86400" always;
}
