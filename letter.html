<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="有些话写在信里，比说出来更长久">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f06292' d='M12 21s-6.7-4.35-9.33-8.11C.9 10.2 1.6 6.5 4.5 5.3c2.5-1.04 5.05.03 6.5 2.17 1.45-2.14 4-3.21 6.5-2.17 2.9 1.2 3.6 4.9 1.83 7.59C18.7 16.65 12 21 12 21z'/%3E%3C/svg%3E">
  <meta property="og:title" content="情书 · 想对你说的话">
  <meta property="og:description" content="有些话写在信里，比说出来更长久">

  <meta name="theme-color" content="#f06292">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="api/config.php"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/server.js"></script>
</head>
<body data-page="letter.html">

  <nav id="nav">
    <div class="nav-inner">
      <a class="brand" href="home.html"><span class="heart">♥</span><span data-brand>我们的家</span></a>
      <button id="navToggle" aria-label="菜单">☰</button>
      <ul class="nav-links">
        <li><a href="home.html">🏠 首页</a></li>
        <li><a href="gallery.html">📸 相册</a></li>
        <li><a href="timeline.html">🕰️ 时光轴</a></li>
        <li><a href="anniversary.html">🎂 纪念日</a></li>
        <li><a href="letter.html">💌 情书</a></li>
        <li><a href="game.html">🎮 小游戏</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section class="section" style="padding-top:120px">
      <div class="container">
        <div class="section-title reveal">
          <h2>💌 想对你说的话</h2>
          <p>有些话写在信里，比说出来更长久 · 点开信封即可阅读</p>
        </div>
        <div style="text-align:center; margin-bottom: 30px" class="reveal">
          <button class="btn btn-ghost" id="newLetterBtn">✍️ 写一封新情书</button>
        </div>
        <div class="letter-grid" id="letterGrid"></div>
      </div>
    </section>

    <!-- 许愿瓶 -->
    <section class="section" id="wish" style="padding-top:20px">
      <div class="container">
        <div class="section-title reveal">
          <h2>🏺 小小心愿瓶</h2>
          <p>把心愿装进瓶子里，点开看看</p>
        </div>
        <div class="wish-grid" id="wishGrid"></div>
      </div>
    </section>

    <!-- 悄悄话留言板 -->
    <section class="section" id="board" style="padding-top:20px">
      <div class="container">
        <div class="section-title reveal">
          <h2>💬 我们的悄悄话</h2>
          <p>想说什么就写下来，Ta 打开就能看到（存在本机浏览器里）</p>
        </div>
        <div class="board glass reveal">
          <div class="board-input">
            <input class="field" id="msgName" placeholder="昵称" maxlength="10">
            <input class="field" id="msgText" placeholder="写下想说的话…" maxlength="100">
            <button class="btn" id="msgSend">发送</button>
          </div>
          <div class="board-list" id="boardList"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="brand-line">© <span id="footYear"></span> · <span class="foot-heart">♥</span> <span data-brand>我们的家</span></div>
    <div>用爱写成的网站 · 每一天都是纪念日</div>
  </footer>

  <button id="musicBtn" aria-label="音乐"><span id="musicIcon">🎵</span></button>
  <button id="topBtn" aria-label="返回顶部">↑</button>

  <!-- 写情书弹窗 -->
  <div class="modal" id="letterModal">
    <div class="modal-card glass">
      <h3>✍️ 写一封新情书</h3>
      <p class="modal-sub">写完之后会保存在这个浏览器里，Ta 打开就能看到</p>
      <input class="field" id="lmTitle" placeholder="标题（如：写给明天的你）" maxlength="30">
      <textarea class="field" id="lmBody" rows="6" placeholder="把想说的话写下来…" maxlength="1000"></textarea>
      <input class="field" id="lmSign" placeholder="署名（如：你的 待定A）" maxlength="20">
      <div class="modal-btns">
        <button class="btn btn-ghost" id="lmCancel">取消</button>
        <button class="btn" id="lmSave">💌 保存情书</button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("footYear").textContent = new Date().getFullYear();
  </script>
  <script src="assets/js/letters.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
