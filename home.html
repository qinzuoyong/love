  <main>
    <!-- Hero -->
    <section class="hero">
      <div class="hero-inner">
        <p class="hero-greeting" id="heroGreeting"></p>
        <h1 class="names" id="heroNames"></h1>
        <p class="slogan" id="heroSlogan"></p>
        <div class="rotator">
          <div class="msg" id="rotMsg"></div>
        </div>
        <div class="hero-btns">
          <a class="btn" href="gallery.html">📸 看我们的相册</a>
          <a class="btn btn-ghost" href="letter.html">💌 读一封情书</a>
          <button class="btn btn-ghost" id="cardBtn" type="button">🎁 生成纪念卡</button>
        </div>

        <!-- 今日特殊日(生日/纪念日当天) -->
        <div class="today-banner" id="todayBanner" style="display:none"></div>
      </div>
    </section>

    <!-- 在一起天数 -->
    <section class="section stat-band">
      <div class="container">
        <div class="stat-grid">
          <div class="stat-card glass reveal">
            <div class="num" id="daysNum">0</div>
            <div class="label">天</div>
          </div>
          <div class="stat-card glass reveal" style="transition-delay:80ms">
            <div class="num" id="hoursNum">00</div>
            <div class="label">时</div>
          </div>
          <div class="stat-card glass reveal" style="transition-delay:160ms">
            <div class="num" id="minsNum">00</div>
            <div class="label">分</div>
          </div>
          <div class="stat-card glass reveal" style="transition-delay:240ms">
            <div class="num" id="secsNum">00</div>
            <div class="label">秒</div>
          </div>
        </div>
        <p class="hint reveal" id="daysHint"></p>
      </div>
    </section>

    <!-- 恋爱进度环 + 回忆闪现 -->
    <section class="section">
      <div class="container">
        <div class="progress-row">
          <div class="progress-card glass reveal">
            <div class="ring-wrap">
              <svg class="ring" id="ringSvg" viewBox="0 0 120 120">
                <defs>
                  <!-- SVG 的 stroke 在多数浏览器里不接受 CSS 渐变函数（linear-gradient()），
                       声明会被整条丢弃、填充环直接不显示。这里改用真正的 SVG 渐变。 -->
                  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ff8aab"></stop>
                    <stop offset="55%" stop-color="#f06292"></stop>
                    <stop offset="100%" stop-color="#d81b60"></stop>
                  </linearGradient>
                </defs>
                <circle class="ring-bg" cx="60" cy="60" r="54"></circle>
                <!-- 渐变必须写成 SVG 呈现属性（别挪回外部 CSS 的 stroke: 里）：
                     样式表内的 url(#id) 在部分浏览器按"样式表基准"解析，取不到本页渐变 -->
                <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="54" stroke="url(#ringGrad)"></circle>
              </svg>
              <div class="ring-center">
                <div class="ring-pct" id="ringPct">0%</div>
                <div class="ring-label">爱的进度</div>
              </div>
            </div>
            <p class="ring-text" id="ringText"></p>
          </div>
          <div class="memory-card glass reveal" style="transition-delay:100ms">
            <div class="memory-title">📸 我们的回忆</div>
            <img class="mem-img" id="memoryImg" alt="回忆闪现">
            <div class="memory-cap" id="memoryCap"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 每日一问 -->
    <section class="section" id="daily">
      <div class="container">
        <div class="section-title reveal">
          <h2>💬 每日一问</h2>
          <p>每天一题 · 两个人都答完，才能看到对方的答案</p>
        </div>
        <div class="daily-card glass reveal" id="dailyCard"></div>
      </div>

    <!-- 介绍卡片 -->
    <section class="section">
      <div class="container">
        <div class="section-title reveal">
          <h2>关于我们</h2>

        </div>
        <div class="card-grid" id="cardGrid"></div>
      </div>
    </section>

  <!-- 页脚 -->
  <footer>
    <div class="brand-line">© <span id="footYear"></span> · <span class="foot-heart">♥</span> <span data-brand>我们的家</span></div>
    <div>用爱写成的网站 · 每一天都是纪念日</div>
  </footer>

  <!-- 悬浮按钮 -->
  <button id="musicBtn" aria-label="音乐"><span id="musicIcon">🎵</span></button>
  <button id="topBtn" aria-label="返回顶部">↑</button>
  <canvas id="fxCanvas"></canvas>

  <!-- 脚本 -->
  <script>
    (function () {
      // 时段问候语(可用 config.greeting 固定)
      var greetEl = document.getElementById("heroGreeting");
      if (greetEl) {
        var g = (CONFIG.greeting || "").trim();
        if (!g) {
          var h = new Date().getHours();
          var greet = h < 5 ? "夜深了" : h < 9 ? "早上好" : h < 12 ? "上午好" : h < 14 ? "中午好" : h < 18 ? "下午好" : h < 23 ? "晚上好" : "夜深了";
          g = greet + "，我的" + CONFIG.names.girl;
        }
        greetEl.textContent = g;
      }

      // 标语
      document.getElementById("heroSlogan").textContent = CONFIG.slogan;

      // 情话轮播(打字机效果)
      var msgs = CONFIG.messages && CONFIG.messages.length ? CONFIG.messages : ["我爱你"];
      var el = document.getElementById("rotMsg");
      var mi = 0;
      var typing = null;
      function show() {
        el.classList.remove("show");
        var text = msgs[mi % msgs.length];
        mi++;
        el.textContent = "";
        el.classList.add("show");
        // 系统开了"减弱动态效果"：直接显示全文，不逐字打字
        if (window.__loveReduceMotion) { el.textContent = text; return; }
        var i = 0;
        clearInterval(typing);
        typing = setInterval(function () {
          i++;
          el.textContent = text.slice(0, i);
          if (i >= text.length) clearInterval(typing);
        }, 90);
      }
      show();
      setInterval(show, 5200);

      /* 链接白名单：只放行站内相对路径与 http(s)。
         防止直接编辑 config.js / data/config.json（绕过后台 cfg_link 校验）
         塞进 javascript: 这类伪协议 —— escHtml 只转义引号，
         拦不住不需要引号的 javascript:xxx。 */
      function safeLink(v) {
        var s = String(v == null ? "" : v).trim();
        if (/^(https?:\/\/|\.{0,2}\/|#|[A-Za-z0-9_-]+\.html)/i.test(s)) return s;
        return "#";
      }

      // 介绍卡片
      var grid = document.getElementById("cardGrid");
      CONFIG.homeCards.forEach(function (c, i) {
        var d = document.createElement("div");
        d.className = "feature-card glass reveal";
        d.style.transitionDelay = (i % 3) * 90 + "ms";
        d.innerHTML =
          '<div class="icon">' + escHtml(c.icon) + "</div>" +
          "<h3>" + escHtml(c.title) + "</h3>" +
          "<p>" + escHtml(c.text) + "</p>" +
          '<a class="link" href="' + escHtml(safeLink(c.link)) + '">' + escHtml(c.linkText) + "</a>";
        grid.appendChild(d);
      });

      document.getElementById("footYear").textContent = new Date().getFullYear();
    })();
  </script>
  <!-- 纪念卡预览 -->
  <div class="modal" id="cardModal">

        <button class="btn" id="cardShareBtn" type="button" style="display:none">↗ 分享</button>
